<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d1025">
  <title>Play bok Game</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(circle at 50% 30%, #27366a 0%, #151b3a 42%, #0d1025 100%);
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
    }
    main { width: min(100%, 380px); }
    .icon { font-size: 64px; margin-bottom: 18px; filter: drop-shadow(0 8px 20px #0007); }
    h1 { margin: 0 0 12px; font-size: clamp(30px, 8vw, 42px); }
    p { margin: 0 0 30px; color: #b9c4e7; line-height: 1.5; }
    button {
      width: 100%;
      min-height: 62px;
      border: 0;
      border-radius: 18px;
      background: linear-gradient(135deg, #ffda55, #ff9e2d);
      color: #231b12;
      font: 800 21px Arial, Helvetica, sans-serif;
      cursor: pointer;
      box-shadow: 0 12px 28px #ff9e2d38;
    }
    button:hover { filter: brightness(1.08); }
    button:focus-visible { outline: 3px solid white; outline-offset: 4px; }
    .spinner {
      width: 66px;
      height: 66px;
      margin: 0 auto 22px;
      border: 6px solid #ffffff2c;
      border-top-color: #ffbf39;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    .loading { font-size: 24px; font-weight: bold; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2s; } }
  </style>
</head>
<body>
  <main id="screen" aria-live="polite"></main>
  <script>
    const screen = document.getElementById('screen');

    function showPlay() {
      screen.innerHTML = '<div class="icon" aria-hidden="true">🎮</div><h1>Ready pm to Play?</h1><p>Press the button to start.</p><button type="button" id="play">Play</button>';
      document.getElementById('play').addEventListener('click', function () {
        showLoading();
        setTimeout(showPlayGame, 2500);
      });
    }

    function showLoading() {
      screen.innerHTML = '<div class="spinner" role="status" aria-label="Loading"></div><div class="loading">Loading...</div>';
    }

    function showPlayGame() {
      screen.innerHTML = '<div class="icon" aria-hidden="true">🎮</div><h1>Game is Ready!</h1><p>Press Play Game to continue.</p><button type="button" id="playGame">Play Game</button>';
      document.getElementById('playGame').addEventListener('click', showLoading);
    }

    showPlay();
  </script>
</body>
</html>
