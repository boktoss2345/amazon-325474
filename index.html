<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#131921">
  <title>Opening Amazon</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: #131921; color: #fff; font: 16px Arial, sans-serif; text-align: center; }
    .card { max-width: 360px; }
    .spinner { width: 42px; height: 42px; margin: 0 auto 24px; border: 4px solid #4b5563; border-top-color: #ff9900; border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    a { display: inline-block; margin-top: 20px; padding: 13px 22px; border-radius: 8px; background: #ff9900; color: #111; text-decoration: none; font-weight: bold; }
  </style>
</head>
<body>
  <main class="card">
    <div class="spinner" aria-hidden="true"></div>
    <p>Opening Amazon.com…</p>
    <a href="https://www.amazon.com/">Open Amazon</a>
  </main>
  <script>
    window.location.replace('https://www.amazon.com/');
  </script>
</body>
</html>
